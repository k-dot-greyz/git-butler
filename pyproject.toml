[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-steward"
version = "0.0.1-scaffold"
description = "Deterministic git + GitHub CLI workflow helper. Policy-as-code, agent-native."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
mcp = ["fastmcp>=0.1"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
]

[project.scripts]
git-steward = "git_steward.cli:app"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
